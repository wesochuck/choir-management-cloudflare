<svg xmlns="http://www.w3.org/2000/svg" width="470" height="965" viewBox="0 0 470 965" role="img" aria-labelledby="mobileTitle mobileDescription"><title id="mobileTitle">Responsive mobile Event Editor design with selected TBD venue</title><desc id="mobileDescription">Illustration of mobile full-screen event editor. Instead of desktop sidebar there is an Event section selector. Schedule and Venue shows venue TBD selected with a non-blocking reminder and accessible fixed Save and Cancel footer.</desc>
