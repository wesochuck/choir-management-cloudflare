<text x="93" y="115" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#925021" font-weight="700" text-anchor="middle">Unsaved changes</text>
<line x1="17" y1="142" x2="454" y2="142" stroke="#DEE6EE" stroke-width="1"/>
<rect x="17" y="143" width="436" height="768" rx="0" fill="#FBFCFD"/>
