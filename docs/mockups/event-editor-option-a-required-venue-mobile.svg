<text x="34" y="278" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#172942" font-weight="800" >Schedule &amp; venue</text>
<text x="34" y="302" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#657D97" font-weight="400" >Enter times in America/New_York.</text>
