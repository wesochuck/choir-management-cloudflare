name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: permanent-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the CI-qualified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Ignore a qualified commit superseded on main
        id: current
        run: |
          git fetch origin main --depth=1
          if test "$(git rev-parse origin/main)" = "$RELEASE_SHA"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; this qualified release will not mutate staging." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: ${{ steps.current.outputs.deploy == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Download the artifact from the successful CI run
        if: ${{ steps.current.outputs.deploy == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify immutable release identity
        if: ${{ steps.current.outputs.deploy == 'true' }}
        run: npm run release:artifact:verify -- --sha "$RELEASE_SHA"

      - name: Install exact lockfile
        if: ${{ steps.current.outputs.deploy == 'true' }}
        run: npm ci

      - name: Capture the current staging Worker version
        if: ${{ steps.current.outputs.deploy == 'true' }}
        id: previous
        run: |
          npx --no-install wrangler deployments status --json \
            --config apps/worker/wrangler.jsonc --env staging > "$RUNNER_TEMP/staging-deployment.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const status = JSON.parse(readFileSync(process.env.STATUS_FILE, "utf8"));
            const current = status.versions?.find((entry) => entry.percentage === 100)?.version_id ?? "";
            process.stdout.write(`version_id=${current}\n`);
          ' >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATUS_FILE: ${{ runner.temp }}/staging-deployment.json

      - name: Apply forward-only control-plane migrations
        if: ${{ steps.current.outputs.deploy == 'true' }}
        run: >-
          npx --no-install wrangler d1 migrations apply CONTROL_DB --config
          apps/worker/wrangler.jsonc --env staging --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload the prebuilt artifact as a Worker Version
        if: ${{ steps.current.outputs.deploy == 'true' }}
        id: upload
        run: |
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/version-upload.json"
          npx --no-install wrangler versions upload apps/worker/dist/index.js \
            --no-bundle \
            --assets apps/web/dist \
            --config apps/worker/wrangler.jsonc \
            --env staging \
            --var "BUILD_VERSION:$RELEASE_SHA" \
            --tag "ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            --message "CI release $RELEASE_SHA"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const records = readFileSync(process.env.RESULT_FILE, "utf8")
              .split(/\r?\n/u)
              .map((line) => line.trim())
              .filter(Boolean)
              .flatMap((line) => {
                try {
                  return [JSON.parse(line)];
                } catch {
                  return [];
                }
              });
            const result = records.find(
              (record) =>
                record &&
                typeof record === "object" &&
                typeof record.version_id === "string",
            );
            if (!result) throw new Error("Wrangler did not report a Worker version ID.");
            process.stdout.write(`version_id=${result.version_id}\n`);
          ' >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESULT_FILE: ${{ runner.temp }}/version-upload.json

      - name: Shift staging traffic to the uploaded version
        if: ${{ steps.current.outputs.deploy == 'true' }}
        id: deploy_version
        run: >-
          npx --no-install wrangler versions deploy "${{ steps.upload.outputs.version_id }}@100%"
          --yes --config apps/worker/wrangler.jsonc --env staging --message "Staging release
          $RELEASE_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply version-external routes, schedules, queues, and workflows
        if: ${{ steps.current.outputs.deploy == 'true' }}
        run: >-
          npx --no-install wrangler triggers deploy --config apps/worker/wrangler.jsonc --env
          staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Qualify the exact staging release with API checks
        if: ${{ steps.current.outputs.deploy == 'true' }}
        run: npm run qualify:staging
        env:
          STAGING_EXPECTED_VERSION: ${{ env.RELEASE_SHA }}

      - name: Roll back traffic after a failed staging qualification
        if: >-
          ${{ failure() && steps.deploy_version.outcome == 'success' &&
          steps.previous.outputs.version_id != '' }}
        run: >-
          npx --no-install wrangler versions deploy "${{ steps.previous.outputs.version_id }}@100%"
          --yes --config apps/worker/wrangler.jsonc --env staging --message "Automatic rollback from
          $RELEASE_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Record staging provenance
        if: ${{ success() && steps.current.outputs.deploy == 'true' }}
        run: |
          echo "Commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Lockfile: $(sha256sum package-lock.json | cut -d ' ' -f 1)" >> "$GITHUB_STEP_SUMMARY"
          echo "CI run: ${{ github.event.workflow_run.html_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker version: ${{ steps.upload.outputs.version_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://staging.musicsite.org" >> "$GITHUB_STEP_SUMMARY"
