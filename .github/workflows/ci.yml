name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install reproducible dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate parity ledger
        run: npm run check:parity

      - name: Audit parity implementation
        run: npm run check:parity:implementation

      - name: Unit tests
        run: npm test

      - name: Workerd integration tests
        run: npm run test:integration

      - name: Build deployable artifact
        run: npm run build

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high
